<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vargans Mondkalender</title>
  <style>
    :root{
      --bg:#111214;
      --panel:#181a1d;
      --line:#34383e;
      --text:#eee9df;
      --muted:#a8a39a;
      --danger:#b83a32;
      --danger2:#e36a58;
      --moon:#e9e2c8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:transparent;
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    .wrap{
      max-width:760px;
      margin:0 auto;
      padding:18px;
    }
    .card{
      background:linear-gradient(180deg,#1b1d20,#121315);
      border:1px solid var(--line);
      border-radius:18px;
      padding:22px;
      box-shadow:0 12px 40px rgba(0,0,0,.28);
    }
    .top{
      display:flex;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
    }
    .moon{
      width:96px;height:96px;
      border-radius:50%;
      display:grid;place-items:center;
      font-size:64px;
      background:#0d0e10;
      border:1px solid #3a3d42;
      box-shadow:0 0 28px rgba(230,224,200,.06);
    }
    h1{
      margin:0 0 4px;
      font-size:26px;
      letter-spacing:.02em;
    }
    .sub{
      color:var(--muted);
      font-size:14px;
    }
    .grid{
      margin-top:22px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
    }
    .box{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px;
    }
    .label{
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.12em;
      margin-bottom:5px;
    }
    .value{
      font-size:18px;
      font-weight:700;
    }
    .influence{
      margin-top:14px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px;
    }
    .bar{
      height:10px;
      background:#292c31;
      border-radius:999px;
      overflow:hidden;
      margin-top:10px;
    }
    .fill{
      height:100%;
      width:20%;
      background:linear-gradient(90deg,#6b2521,var(--danger2));
      transition:width .25s ease;
    }
    .warning{
      margin-top:12px;
      color:#cbc5ba;
      font-style:italic;
      min-height:22px;
    }
    .controls{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    button{
      appearance:none;
      border:1px solid #454951;
      background:#202328;
      color:var(--text);
      border-radius:10px;
      padding:10px 14px;
      font-weight:700;
      cursor:pointer;
    }
    button:hover{background:#282c31}
    .days{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(10,1fr);
      gap:6px;
    }
    .day{
      aspect-ratio:1;
      min-width:0;
      display:grid;
      place-items:center;
      border-radius:8px;
      background:#17191c;
      border:1px solid #30343a;
      color:#8f8b84;
      font-size:12px;
    }
    .day.hot{border-color:#59302d;color:#c8a09b}
    .day.current{
      color:#fff;
      border-color:#d4cec1;
      box-shadow:0 0 0 1px #d4cec1 inset;
      font-weight:800;
      background:#24272b;
    }
    @media(max-width:600px){
      .grid{grid-template-columns:1fr}
      .days{grid-template-columns:repeat(6,1fr)}
      .moon{width:80px;height:80px;font-size:54px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="moon" id="moonIcon">🌑</div>
        <div>
          <h1>Vargans Mondkalender</h1>
          <div class="sub" id="phaseText">Neumond</div>
        </div>
      </div>

      <div class="grid">
        <div class="box">
          <div class="label">Mondzyklus</div>
          <div class="value" id="dayText">Tag 1 / 30</div>
        </div>
        <div class="box">
          <div class="label">Bis Vollmond</div>
          <div class="value" id="fullMoonText">14 Tage</div>
        </div>
        <div class="box">
          <div class="label">Baaraels Einfluss</div>
          <div class="value" id="riskText">Gering</div>
        </div>
      </div>

      <div class="influence">
        <div class="label">Druck der Urbestie</div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="warning" id="warning">Baarael ist fern und ungewöhnlich still.</div>
      </div>

      <div class="controls">
        <button onclick="changeDay(-1)">← Vorheriger Tag</button>
        <button onclick="changeDay(1)">Nächster Tag →</button>
        <button onclick="resetCalendar()">Zurücksetzen</button>
      </div>

      <div class="days" id="days"></div>
    </div>
  </div>

<script>
  let day = Number(localStorage.getItem("varganMoonDay") || 1);

  function phaseForDay(d){
    if(d === 1) return ["🌑","Neumond"];
    if(d <= 6) return ["🌒","Zunehmende Sichel"];
    if(d === 7) return ["🌓","Erstes Viertel"];
    if(d <= 12) return ["🌔","Zunehmender Mond"];
    if(d <= 14) return ["🌔","Fast Vollmond"];
    if(d === 15) return ["🌕","Vollmond"];
    if(d <= 17) return ["🌖","Nachhall des Vollmonds"];
    if(d <= 22) return ["🌖","Abnehmender Mond"];
    if(d === 23) return ["🌗","Letztes Viertel"];
    return ["🌘","Abnehmende Sichel"];
  }

  function influenceForDay(d){
    if(d === 15) return [100,"Extrem","Die Grenze zwischen Vargan und Baarael ist hauchdünn."];
    if(d === 14 || d === 16) return [85,"Hoch","Baarael ist nah. Jeder Trigger wiegt schwerer."];
    if(d === 13 || d === 17) return [70,"Deutlich erhöht","Die Urbestie wird unruhig und aufdringlich."];
    if((d >= 8 && d <= 12) || (d >= 18 && d <= 22)) return [50,"Erhöht","Baaraels Präsenz ist deutlich spürbar."];
    if(d === 7 || d === 23) return [35,"Leicht erhöht","Die Grenze beginnt sich zu verschieben."];
    return [18,"Gering","Baarael ist fern und ungewöhnlich still."];
  }

  function daysToFullMoon(d){
    if(d <= 15) return 15 - d;
    return 30 - d + 15;
  }

  function renderDays(){
    const root = document.getElementById("days");
    root.innerHTML = "";
    for(let i=1;i<=30;i++){
      const el = document.createElement("div");
      el.className = "day";
      if(i >= 13 && i <= 17) el.classList.add("hot");
      if(i === day) el.classList.add("current");
      el.textContent = i;
      root.appendChild(el);
    }
  }

  function render(){
    const [icon,phase] = phaseForDay(day);
    const [pct,risk,warning] = influenceForDay(day);
    const until = daysToFullMoon(day);

    document.getElementById("moonIcon").textContent = icon;
    document.getElementById("phaseText").textContent = phase;
    document.getElementById("dayText").textContent = `Tag ${day} / 30`;
    document.getElementById("fullMoonText").textContent = until === 0 ? "Heute" : `${until} Tag${until === 1 ? "" : "e"}`;
    document.getElementById("riskText").textContent = risk;
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("warning").textContent = warning;

    renderDays();
    localStorage.setItem("varganMoonDay", day);
  }

  function changeDay(delta){
    day += delta;
    if(day < 1) day = 30;
    if(day > 30) day = 1;
    render();
  }

  function resetCalendar(){
    day = 1;
    render();
  }

  render();
</script>
</body>
</html>
